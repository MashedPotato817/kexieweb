<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面不存在 · 科技创新与智能创造协会</title>
    <style>
      /* 404 可能在任意路径触发，相对引用会失效，因此样式全部内联、不依赖外部资源 */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.7 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        color: #f7f9fc;
        background: #10233f;
        text-align: center;
      }
      main { padding: 24px; max-width: 480px; }
      .code {
        margin: 0;
        font-size: 4.5rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.1;
        color: #49d5ed;
      }
      h1 { margin: 0.8rem 0 1rem; font-size: 1.3rem; line-height: 1.4; }
      p { margin: 0 0 2rem; color: rgba(247, 249, 252, 0.75); }
      a {
        display: inline-block;
        padding: 0.75rem 1.2rem;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 999px;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        transition: border-color 0.18s ease, color 0.18s ease;
      }
      a:hover { border-color: #49d5ed; color: #49d5ed; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>这个页面不存在或已移动</h1>
      <p>链接可能已失效。回到首页看看最新的活动与招新信息吧。</p>
      <a href="/kexieweb/">回到首页</a>
    </main>
  </body>
</html>
